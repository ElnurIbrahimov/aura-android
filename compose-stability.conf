// Types treated as stable by the Compose compiler.
//
// Each line is a promise that instances of the type are never mutated after being handed
// to a composable. Everything here is held by an all-`val` state class and replaced
// through `copy()`, so the promise is one this codebase already keeps — but it is a
// promise, and a class that starts mutating a list in place will silently stop
// recomposing rather than fail to compile. That is the cost of the entry.

// The standard read-only collection interfaces. The compiler cannot know an
// implementation is not a MutableList behind the interface, so it assumes the worst;
// every list in this app comes from map/filter/toList or a Room query and is replaced
// wholesale on change.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
kotlin.collections.Collection

// Kotlin's own immutable wrappers around time and identity, used across the state classes.
kotlin.time.Duration
java.time.*
