# CI workflow for Aura Android
# Repository: github.com/ElnurIbrahimov/aura-android
name: CI

on:
  push:
    branches: [main, feat/tier-1-friction]
  pull_request:
    branches: [main, feat/tier-1-friction]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Cold builds on the free 2-core runner exceed 45m: 2014 unit tests +
    # lintDebug on both modules + assembleRelease (R8). 90m gives a full
    # cold run room; cached runs finish in ~10m.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AGP 9.3 requires JDK 17+; 21 matches local development.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # setup-android v4 restored the `packages` input, so the SDK components
      # the build needs are installed directly here instead of via a separate
      # sdkmanager step. Match what the modules pin (compileSdk 37; AGP 9.3
      # default build-tools 36.0.0).
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Logging hygiene lint
        run: bash scripts/lint-logging.sh

      # scripts/check-version-docs.sh existed but was never wired in, so
      # docs/architecture.md sat at v0.58.0 while the build shipped v0.65.0.
      # A gate nobody runs is not a gate.
      - name: Version documentation drift
        run: bash scripts/check-version-docs.sh

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache Gradle home (dependencies and caches)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          # Cache key includes all build files so dependency changes
          # bust the cache. The fallback restore-keys let a partial
          # cache hit from a prior version speed up the download even
          # when the exact key doesn't match.
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build, test, and lint
        run: ./gradlew :aura-core:assembleDebug :aura-core:testDebugUnitTest :aura-core:lintDebug :app:assembleDebug :app:testDebugUnitTest :app:lintDebug

      # The release build is the only one that runs R8 minification and
      # resource shrinking, so it is the only one that can catch a missing
      # keep rule. CI previously built debug only, and assembleRelease had
      # rotted to the point of failing outright on a missing pdfbox class —
      # meaning no shippable APK could be produced at all, discoverable only
      # at ship time. Keep this step so that cannot recur.
      # No signing secrets in CI: app/build.gradle.kts falls back to the debug
      # key (with a warning) when AURA_KEYSTORE_* values are absent, so this
      # step exercises R8 without needing the upload keystore.
      - name: Build release (R8 / minification)
        run: ./gradlew :app:assembleRelease

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            aura-core/build/reports/tests/
            aura-core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7