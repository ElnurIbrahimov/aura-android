# CI workflow for Aura Android
# Repository: github.com/ElnurIbrahimov/aura-android
name: CI

# Every branch, not a hardcoded pair. The list said [main, feat/tier-1-friction]
# while development ran on feat/p3-longform, so the 46 commits between
# 2026-08-05 and 2026-08-11 were gated by nothing at all — including a
# MIGRATION_1_2 that crashed the app on launch for any v1 database.
# A gate that does not run on the branch you work on is not a gate.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Keyed on the COMMIT, not the ref, and that distinction is the whole point.
#
# `push: ['**']` and `pull_request` both fire for a branch with an open PR, and
# `github.ref` is `refs/heads/<branch>` for one and `refs/pull/N/merge` for the
# other — different groups, so neither cancelled the other and every push ran
# the whole workflow twice. With two emulator jobs per run that is four
# emulators booting at once on 2-core runners, contending for KVM and for the
# same AVD cache entry, which is how `adb: device offline` became routine: 8 of
# 13 failures across a 40-run sample were emulator jobs, at a 38% overall
# failure rate, with the same commit passing in one run and failing in its twin.
#
# `github.event.pull_request.head.sha` and `github.sha` are the same commit from
# the two events' points of view, so both land in one group and one cancels the
# other. Branch gating is unchanged — the `push: ['**']` above stays, because a
# gate that does not run on the branch you work on is not a gate.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

# Split into three jobs on 2026-08-08, after the first run that ever reached
# Gradle hit the 90-minute ceiling and revealed a self-sustaining failure:
#
#   the job times out -> actions/cache writes in its POST step -> post steps are
#   SKIPPED on cancellation -> the Gradle cache is never saved -> the next run is
#   cold too -> it times out as well.
#
# Every run since the Phase 7 toolchain jump (00cd0312) had died in `Setup
# Android SDK` on a bad package id, so the single-job layout and its "90m gives
# a full cold run room" estimate were never actually exercised. They do not hold:
# a cold build of 2,152 unit tests plus lintDebug on both modules plus an R8
# release build does not fit in 90 minutes on the free 2-core runner.
#
# build-test and lint-release now run concurrently, each with its own budget, so
# wall-clock is roughly halved and each has room to finish and persist its cache.
# Once a cache exists, both settle to ~10 minutes and the timeout stops mattering.
jobs:
  # Cheap correctness gates. No JDK, no SDK, no Gradle — a few seconds. Kept as a
  # prerequisite rather than a parallel job so a logging or doc-drift violation
  # still short-circuits the expensive work, which was the original intent when
  # these were the first steps of the single job.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Logging hygiene lint
        run: bash scripts/lint-logging.sh

      # scripts/check-version-docs.sh existed but was never wired in, so
      # docs/architecture.md sat at v0.58.0 while the build shipped v0.65.0.
      # A gate nobody runs is not a gate.
      - name: Version documentation drift
        run: bash scripts/check-version-docs.sh

      # The corpus builder decides which memories reach the eval and which
      # judgments survive, and both of its rules fail *quietly*: a labelled
      # memory outside the window dangles its judgment, and a query that loses
      # its last positive to a forgotten memory looks exactly like a query that
      # expected nothing — which inflates correctly_empty_rate for a reason that
      # has nothing to do with retrieval. The second got past a hand check on the
      # function's first run. Runs here because it needs python3 and nothing else.
      - name: Eval corpus builder self-test
        run: python3 scripts/build_eval_corpus.py --self-test

      # The pooling step is what makes a Gate B verdict mean anything, and it has
      # one rule that decides a number rather than shaping one: a query counts as
      # `synonym-only` only if it shares no stemmed token with its own answers.
      # That class's share is two thirds of the Gate B bar and is assigned by a
      # model, so it is verified rather than believed.
      - name: Eval query pooling self-test
        run: python3 scripts/pool_eval_queries.py --self-test

      # 145 hardcoded strings were moved into strings.xml on 2026-08-16, and that
      # work is only worth anything if it stays done — a translation is
      # all-or-nothing from the user's side, and the count reached 205 one PR at
      # a time. Interpolated strings are still allowed and counted, not silenced.
      - name: Hardcoded user-visible strings
        run: bash scripts/check-hardcoded-strings.sh

  build-test:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AGP 9.3 requires JDK 17+; 21 matches local development.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # The platform package is `android-37.0`, NOT `android-37`. API 37 ships
      # with a minor component in its version string — the installed SDK
      # directory is `platforms/android-37.0` and its source.properties reads
      # `AndroidVersion.ApiLevel=37.0`. `platforms;android-37` does not resolve,
      # and sdkmanager reports it as `Warning: Failed to find package` before
      # exiting 1, which failed every run in ~40s during setup.
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Split restore/save instead of the combined action, because the combined
      # action writes its cache in a POST step and POST steps are SKIPPED when a
      # job is cancelled. That produced a self-sustaining failure: the job times
      # out -> the cache is never saved -> the next run is cold too -> it times
      # out as well. CI on this repo had not gone green since 2026-08-05 for
      # exactly this reason. `if: always()` on the save step breaks the loop —
      # a run that times out still leaves a warm cache behind for the next one.
      - name: Restore Gradle home (dependencies and caches)
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          # Distinct suffix per job so the two parallel jobs do not race to write
          # the same entry; restore-keys let either fall back to the other's.
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-build
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      # Robolectric does NOT resolve its `android-all-instrumented` jars through
      # Gradle. It fetches them itself, over the network, from inside the running
      # test task, into ~/.m2/repository — which the Gradle cache above does not
      # cover. That is 326 MB for the two SDK levels this repo pins (sdk=36 in
      # aura-core/src/test/resources/robolectric.properties, plus API 30 from the
      # four @Config(sdk = [30]) tests; Robolectric names them by Android release,
      # so those are `16-robolectric-*` and `11-robolectric-*`).
      #
      # Downloading that on every run is what actually caused the 2026-08-12
      # timeouts: `> Task :aura-core:testDebugUnitTest` printed nothing for 86
      # minutes and the job was killed at the 90-minute ceiling, while
      # lint-release — which runs no unit tests — finished in 15 minutes in the
      # same runs. The test suite itself takes ~4 minutes.
      #
      # A SEPARATE cache entry, not another path on the one above. That entry's
      # key is a hash of the build files, so adding a path to it would leave
      # cache-hit == 'true' on the first run, skip the save step, and never
      # persist the jars — the same never-warms deadlock described above. This
      # key moves only when the Robolectric version or the pinned SDK moves.
      - name: Restore Robolectric android-all jars
        id: robolectric-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml', 'aura-core/src/test/resources/robolectric.properties') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      # One task list per step, smallest first. A single 4-task invocation gave
      # no signal about WHERE the 90 minutes went, and a timeout killed the whole
      # thing with nothing reported. Ordered so the cheapest failure surfaces
      # first on a cold cache.
      - name: Build and test :aura-core
        run: ./gradlew :aura-core:assembleDebug :aura-core:testDebugUnitTest

      - name: Build and test :app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      # Compile-only. Instrumented tests need a device and CI has none, so these
      # 25 Room MigrationTestHelper methods have never executed — which is how
      # MIGRATION_1_2 shipped two of the four columns it needed and crashed the
      # app on launch. Compiling them will not run the assertions, but it does
      # stop them rotting invisibly against entity changes, which is the failure
      # that actually happened.
      - name: Compile instrumented tests (no device required)
        run: ./gradlew :aura-core:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Save Gradle home (dependencies and caches)
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-build

      # always(), for the same reason as the Gradle save above: the run that
      # times out is precisely the run that paid for the download, and a POST
      # step would be skipped on cancellation and throw it away.
      - name: Save Robolectric android-all jars
        if: always() && steps.robolectric-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml', 'aura-core/src/test/resources/robolectric.properties') }}

      # README.md and architecture.md state the test count in the present tense,
      # and it drifted from 2,152 to 2,225 unnoticed — check-version-docs.sh
      # gates the version string and nothing else. This one reads the JUnit XML,
      # so it belongs here rather than in `gates`, which has no JDK or Gradle
      # and could only ever guess. It errors out when the XML is absent, so it
      # cannot pass by having read nothing.
      - name: Test-count documentation drift
        run: bash scripts/check-test-count.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      # always(), not just on failure. This scorecard says what a change did to
      # retrieval quality, and it is most useful on the runs that PASSED — a
      # report you can only see when the build is broken cannot tell you whether
      # a change was an improvement.
      - name: Upload retrieval eval scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval
          path: aura-core/build/reports/retrieval-eval/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            aura-core/build/reports/tests/
            aura-core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  # Room migrations, actually executed.
  #
  # Every other job here compiles the instrumented tests and stops. The comment
  # on `Compile instrumented tests` in build-test says why that was never
  # enough: MIGRATION_1_2 shipped two of the four columns it needed and crashed
  # the app on launch, and compiling the test that would have caught it does not
  # run a single assertion.
  #
  # These have run exactly once, by hand on a device on 2026-08-14, and that run
  # immediately found a test which had never been capable of passing — see the
  # comment in migrate17To18. 47 migrations across 11 databases have never run
  # on any automated schedule, and a check that depends on someone remembering
  # to plug in a phone is not a gate. It is also the only path in this project
  # where a defect destroys a user's data irreversibly.
  #
  # :aura-core's androidTest source set is *exclusively* the seven database
  # migration suites — 26 methods, no Compose, no Hilt, no smoke tests — so
  # connectedDebugAndroidTest on this module is precisely the migration chain
  # and needs no test filter. :app's instrumented tests are deliberately left
  # out: they need a Hilt runner and a fuller environment, and they are not the
  # thing that loses data.
  #
  # An emulator, never a device. Running these against a real phone replaces
  # app data on it.
  migrations:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Hardware acceleration. Without it the emulator falls back to software
      # rendering and a suite that takes ~2 minutes takes closer to 40.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Distinct `-migrations` suffix for the same reason build-test and
      # lint-release carry their own: parallel jobs must not race to write one
      # cache entry. restore-keys let this fall back to either sibling's.
      - name: Restore Gradle home (dependencies and caches)
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-migrations
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      # Creating an AVD from scratch is most of this job's wall-clock. Keyed on
      # the image, which moves only when this file does.
      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-avd-30-default-x86_64

      # API 30 rather than the compileSdk: these tests exercise SQLite and
      # nothing else, minSdk is 26, and the `default` x86_64 image boots faster
      # than a google_apis one carrying Play services this suite never touches.
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created."

      # always(), for the same reason the Gradle saves use it: a job that times
      # out is precisely the one that paid to build the AVD, and a POST step
      # would be skipped on cancellation and throw it away.
      - name: Save AVD snapshot
        if: always() && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-avd-30-default-x86_64

      - name: Run database migration tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :aura-core:connectedDebugAndroidTest

      - name: Save Gradle home (dependencies and caches)
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-migrations

      - name: Upload migration test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migration-test-results
          path: |
            aura-core/build/reports/androidTests/
            aura-core/build/outputs/androidTest-results/
          retention-days: 7

  # :app's instrumented tests, which had never run anywhere.
  #
  # `build-test` compiles them and stops, and the migrations job deliberately
  # covers `:aura-core` only. So 43 test methods — every `createComposeRule`
  # test, the bottom-nav test, the onboarding test, and `ModelSelectionFlowTest`
  # (the only true end-to-end flow in the repo: real MainActivity, real Hilt,
  # key entry through to a chat override) — compiled green for months without a
  # single assertion executing.
  #
  # That is not hypothetical. `HomeContentTest`'s own comment records that a
  # previous version asserted strings which exist nowhere in the app and could
  # never have passed, and it counted toward the instrumented total the whole
  # time. Compiling a test proves it parses.
  #
  # `DeviceSmokeTest` is excluded by name, not by accident. Its KDoc is explicit
  # that it needs real API keys and a real model, and that pointing
  # `connectedAndroidTest` at an install destroys the Keystore entries the app's
  # encrypted credentials depend on. It is for a throwaway device, run by hand.
  #
  # Separate job rather than folded into `migrations`: these need a Hilt runner
  # and a fuller environment, they are slower, and a failure here means
  # something different from a migration failure. Keeping them apart keeps the
  # signal readable.
  app-instrumented:
    # Waits for `migrations` rather than racing it, and not for its result —
    # `always()` means a red migration suite does not hide the app suite behind
    # it. Two emulators booting simultaneously on one runner pool is the other
    # half of the contention above; this leaves one at a time per commit. It
    # also warms the shared AVD cache, so on a miss the second job reads what
    # the first paid for instead of both building it.
    #
    # Costs wall-clock, deliberately. These two ran in parallel and failed
    # often enough that the parallelism was not buying anything.
    needs: [gates, migrations]
    if: always() && needs.gates.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Restore Gradle home (dependencies and caches)
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-appinstr
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      # Same image and key as the migrations job, so whichever runs first pays
      # for the AVD and the other reads it.
      - name: Restore AVD snapshot
        id: avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-avd-30-default-x86_64

      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD created."

      - name: Save AVD snapshot
        if: always() && steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: ${{ runner.os }}-avd-30-default-x86_64

      # disable-animations matters here in a way it does not for the migration
      # suite: Compose UI assertions race animations that never settle.
      - name: Run :app instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.notClass=com.aura.smoke.DeviceSmokeTest

      - name: Save Gradle home (dependencies and caches)
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-appinstr

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-instrumented-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 7

  lint-release:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Restore/save split for the same reason as build-test: a cancelled job
      # skips POST steps, so the combined action never persists a cache on the
      # runs that most need one.
      - name: Restore Gradle home (dependencies and caches)
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-lint
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      - name: Lint
        run: ./gradlew :aura-core:lintDebug :app:lintDebug

      # The release build is the only one that runs R8 minification and resource
      # shrinking, so it is the only one that can catch a missing keep rule. CI
      # previously built debug only, and assembleRelease had rotted to the point
      # of failing outright on a missing pdfbox class — meaning no shippable APK
      # could be produced at all, discoverable only at ship time. Keep this so
      # that cannot recur.
      # No signing secrets in CI: app/build.gradle.kts falls back to the debug
      # key (with a warning) when AURA_KEYSTORE_* values are absent, so this
      # exercises R8 without needing the upload keystore.
      - name: Build release (R8 / minification)
        run: ./gradlew :app:assembleRelease

      # Without this, every release crash report is unreadable.
      #
      # R8 renames everything, `mapping.txt` is the only thing that undoes it,
      # and it lives in gitignored `build/` — destroyed by the next `clean` and
      # never leaving the runner. The app has no Crashlytics or Sentry;
      # `CrashLogger` writes stack traces to local files and `CrashLogScreen`
      # displays them, so an obfuscated trace is the whole of what a user can
      # report. Keeping the mapping for each build is what makes those traces
      # mean something later.
      #
      # 90 days rather than the 7 used for failure diagnostics: a crash gets
      # reported long after the build that caused it, and a mapping that expired
      # first is the same as never having kept one.
      - name: Upload R8 mapping (deobfuscates release crashes)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r8-mapping-${{ github.sha }}
          path: |
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/release/seeds.txt
          retention-days: 90
          if-no-files-found: error

      - name: Save Gradle home (dependencies and caches)
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-lint

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            aura-core/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.html
          retention-days: 7
