# CI workflow for Aura Android
# Repository: github.com/ElnurIbrahimov/aura-android
name: CI

# Every branch, not a hardcoded pair. The list said [main, feat/tier-1-friction]
# while development ran on feat/p3-longform, so the 46 commits between
# 2026-08-05 and 2026-08-11 were gated by nothing at all — including a
# MIGRATION_1_2 that crashed the app on launch for any v1 database.
# A gate that does not run on the branch you work on is not a gate.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Split into three jobs on 2026-08-08, after the first run that ever reached
# Gradle hit the 90-minute ceiling and revealed a self-sustaining failure:
#
#   the job times out -> actions/cache writes in its POST step -> post steps are
#   SKIPPED on cancellation -> the Gradle cache is never saved -> the next run is
#   cold too -> it times out as well.
#
# Every run since the Phase 7 toolchain jump (00cd0312) had died in `Setup
# Android SDK` on a bad package id, so the single-job layout and its "90m gives
# a full cold run room" estimate were never actually exercised. They do not hold:
# a cold build of 2,152 unit tests plus lintDebug on both modules plus an R8
# release build does not fit in 90 minutes on the free 2-core runner.
#
# build-test and lint-release now run concurrently, each with its own budget, so
# wall-clock is roughly halved and each has room to finish and persist its cache.
# Once a cache exists, both settle to ~10 minutes and the timeout stops mattering.
jobs:
  # Cheap correctness gates. No JDK, no SDK, no Gradle — a few seconds. Kept as a
  # prerequisite rather than a parallel job so a logging or doc-drift violation
  # still short-circuits the expensive work, which was the original intent when
  # these were the first steps of the single job.
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Logging hygiene lint
        run: bash scripts/lint-logging.sh

      # scripts/check-version-docs.sh existed but was never wired in, so
      # docs/architecture.md sat at v0.58.0 while the build shipped v0.65.0.
      # A gate nobody runs is not a gate.
      - name: Version documentation drift
        run: bash scripts/check-version-docs.sh

  build-test:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # AGP 9.3 requires JDK 17+; 21 matches local development.
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      # The platform package is `android-37.0`, NOT `android-37`. API 37 ships
      # with a minor component in its version string — the installed SDK
      # directory is `platforms/android-37.0` and its source.properties reads
      # `AndroidVersion.ApiLevel=37.0`. `platforms;android-37` does not resolve,
      # and sdkmanager reports it as `Warning: Failed to find package` before
      # exiting 1, which failed every run in ~40s during setup.
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Split restore/save instead of the combined action, because the combined
      # action writes its cache in a POST step and POST steps are SKIPPED when a
      # job is cancelled. That produced a self-sustaining failure: the job times
      # out -> the cache is never saved -> the next run is cold too -> it times
      # out as well. CI on this repo had not gone green since 2026-08-05 for
      # exactly this reason. `if: always()` on the save step breaks the loop —
      # a run that times out still leaves a warm cache behind for the next one.
      - name: Restore Gradle home (dependencies and caches)
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          # Distinct suffix per job so the two parallel jobs do not race to write
          # the same entry; restore-keys let either fall back to the other's.
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-build
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      # One task list per step, smallest first. A single 4-task invocation gave
      # no signal about WHERE the 90 minutes went, and a timeout killed the whole
      # thing with nothing reported. Ordered so the cheapest failure surfaces
      # first on a cold cache.
      - name: Build and test :aura-core
        run: ./gradlew :aura-core:assembleDebug :aura-core:testDebugUnitTest

      - name: Build and test :app
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest

      # Compile-only. Instrumented tests need a device and CI has none, so these
      # 25 Room MigrationTestHelper methods have never executed — which is how
      # MIGRATION_1_2 shipped two of the four columns it needed and crashed the
      # app on launch. Compiling them will not run the assertions, but it does
      # stop them rotting invisibly against entity changes, which is the failure
      # that actually happened.
      - name: Compile instrumented tests (no device required)
        run: ./gradlew :aura-core:assembleDebugAndroidTest :app:assembleDebugAndroidTest

      - name: Save Gradle home (dependencies and caches)
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-build

      # README.md and architecture.md state the test count in the present tense,
      # and it drifted from 2,152 to 2,225 unnoticed — check-version-docs.sh
      # gates the version string and nothing else. This one reads the JUnit XML,
      # so it belongs here rather than in `gates`, which has no JDK or Gradle
      # and could only ever guess. It errors out when the XML is absent, so it
      # cannot pass by having read nothing.
      - name: Test-count documentation drift
        run: bash scripts/check-test-count.sh

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 7

      # always(), not just on failure. This scorecard says what a change did to
      # retrieval quality, and it is most useful on the runs that PASSED — a
      # report you can only see when the build is broken cannot tell you whether
      # a change was an improvement.
      - name: Upload retrieval eval scorecard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retrieval-eval
          path: aura-core/build/reports/retrieval-eval/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            aura-core/build/reports/tests/
            aura-core/build/test-results/
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 7

  lint-release:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      # Restore/save split for the same reason as build-test: a cancelled job
      # skips POST steps, so the combined action never persists a cache on the
      # runs that most need one.
      - name: Restore Gradle home (dependencies and caches)
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-lint
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-
            ${{ runner.os }}-gradle-

      - name: Lint
        run: ./gradlew :aura-core:lintDebug :app:lintDebug

      # The release build is the only one that runs R8 minification and resource
      # shrinking, so it is the only one that can catch a missing keep rule. CI
      # previously built debug only, and assembleRelease had rotted to the point
      # of failing outright on a missing pdfbox class — meaning no shippable APK
      # could be produced at all, discoverable only at ship time. Keep this so
      # that cannot recur.
      # No signing secrets in CI: app/build.gradle.kts falls back to the debug
      # key (with a warning) when AURA_KEYSTORE_* values are absent, so this
      # exercises R8 without needing the upload keystore.
      - name: Build release (R8 / minification)
        run: ./gradlew :app:assembleRelease

      - name: Save Gradle home (dependencies and caches)
        if: always() && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/transforms-4
            ~/.gradle/caches/9.7.0
            ~/.gradle/caches/jars-9
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'build.gradle.kts', 'app/build.gradle.kts', 'aura-core/build.gradle.kts', 'gradle/libs.versions.toml') }}-lint

      - name: Upload lint reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-reports
          path: |
            aura-core/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.html
          retention-days: 7
