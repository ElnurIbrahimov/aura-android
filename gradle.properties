org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 ships built-in Kotlin by default; this project uses the external
# org.jetbrains.kotlin.android plugin (required for the serialization and
# compose compiler plugins as configured), so opt out. kotlin-android is
# incompatible with the AGP 9 new DSL, hence newDsl=false as documented.
android.builtInKotlin=false
android.newDsl=false
kotlin.code.style=official
kotlin.incremental=true
